<!--
  app/template.html - the Gauntlet app's code. app/build.ps1 copies it to app/Gauntlet.html and fills the three
  data blocks below (WIRING = design/wiring.json, CHECK = design/check.ps1's results, BUILD = when and from what).
  Nothing about the gauntlet is written in this file: every part, pin, wire, colour, gauge, length, current and
  path comes from WIRING, which design/wiring-gen.ps1 generates from the design files. Edit the design, never
  Gauntlet.html. Works offline from a double-click: no fonts, scripts or images from the internet.
-->
<style>
:root{
  --bg:#D7DDE3; --surface:#F3F5F7; --surface2:#E6EAEE; --ink:#16202A; --muted:#55606C; --line:#B3BCC6;
  --armor:#9B1C2C; --armor-fill:rgba(155,28,44,.08); --outline:#16202A; --gwire:#22282E; --shadow:rgba(10,18,26,.22);
  --arm-fill:#EEF1F4; --arm-line:#8E9AA6; --zone-a:rgba(22,32,42,.025); --zone-b:rgba(22,32,42,.06);
  --pwr:#F0A202; --gnd:#0FA3B1; --sel:#FFB000; --ok:#26733A; --okbg:#DDF0E1; --warn:#8A5A00; --warnbg:#FBEFD2; --bad:#8E1B1B; --badbg:#F7D9D9;
  --dot:#2B2D42; --dotring:#F3F5F7; --flag:#E63946; --sympill:#FFFDF6; --symink:#1D2329; --symlead:#55606C;
  --head:"Bahnschrift","Segoe UI Black","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171C; --surface:#1C232B; --surface2:#252E37; --ink:#E6EAEE; --muted:#9AA6B2; --line:#34404B;
    --armor:#E0647A; --armor-fill:rgba(224,100,122,.10); --outline:#06090C; --gwire:#5C6670; --shadow:rgba(0,0,0,.45);
    --arm-fill:#1A2128; --arm-line:#4C5966; --zone-a:rgba(255,255,255,.015); --zone-b:rgba(255,255,255,.04);
    --ok:#6FCF8A; --okbg:#173322; --warn:#F2C062; --warnbg:#3A2E12; --bad:#FF8A8A; --badbg:#3D1717; color-scheme:dark;
    --dot:#E6EAEE; --dotring:#06090C; --flag:#FF5A66; --sympill:#EDE8DC; --symink:#1D2329; --symlead:#C3CAD1;
  }
}
:root[data-theme="dark"]{
  --bg:#12171C; --surface:#1C232B; --surface2:#252E37; --ink:#E6EAEE; --muted:#9AA6B2; --line:#34404B;
  --armor:#E0647A; --armor-fill:rgba(224,100,122,.10); --outline:#06090C; --gwire:#5C6670; --shadow:rgba(0,0,0,.45);
  --arm-fill:#1A2128; --arm-line:#4C5966; --zone-a:rgba(255,255,255,.015); --zone-b:rgba(255,255,255,.04);
  --ok:#6FCF8A; --okbg:#173322; --warn:#F2C062; --warnbg:#3A2E12; --bad:#FF8A8A; --badbg:#3D1717; color-scheme:dark;
  --dot:#E6EAEE; --dotring:#06090C; --flag:#FF5A66; --sympill:#EDE8DC; --symink:#1D2329; --symlead:#C3CAD1;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
/* header */
.top{flex:none;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 16px 9px;background:var(--surface);border-bottom:3px solid var(--outline)}
.designs{text-decoration:none;color:inherit;font-weight:800}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto;min-width:0}
.brand h1{font:800 28px/1 var(--head);letter-spacing:.05em;margin:0}
.brand h1 span{color:var(--armor)}
.brand .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.chip.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.live{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.live .dot{background:var(--muted)}
.live.on .dot{background:#2EB85C;box-shadow:0 0 0 3px rgba(46,184,92,.2)}
.live.busy .dot{background:var(--pwr);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
/* banners: a disagreement with the design is never hidden */
.banner{flex:none;padding:9px 16px;font-size:14px;border-bottom:1px solid var(--line);display:none}
.banner.on{display:block}
.banner.bad{background:var(--badbg);color:var(--bad);border-bottom:3px solid var(--bad)}
.banner.busy{background:var(--warnbg);color:var(--warn)}
.banner b{font-weight:700}
.banner a{color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.banner ul{margin:4px 0 0;padding-left:18px}
/* toolbar */
.bar{flex:none;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.lbl{font:800 11.5px var(--head);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.grp{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.sys{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.sys[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sys .n{opacity:.6;margin-left:5px;font-size:12px}
.sp{flex:1}
.seg{display:inline-flex;border:2px solid var(--outline);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 13px;font-size:13px;font-weight:700;cursor:pointer}
.seg button+button{border-left:2px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tool{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:14px;font-weight:700;min-width:34px}
.tool:hover{border-color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(760px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:2px solid var(--outline);border-radius:12px;box-shadow:4px 5px 0 var(--shadow);padding:10px 16px;font-size:14px;z-index:50;display:none}
.toast.on{display:block}
.toast.bad{border-color:var(--bad);background:var(--badbg)}
.toast code{font-family:Consolas,monospace;font-size:13px}
.search{position:relative}
.search input{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;width:300px}
.search input::placeholder{color:var(--muted)}
.results{position:absolute;right:0;top:calc(100% + 4px);width:470px;max-height:60vh;overflow:auto;background:var(--surface);border:2px solid var(--outline);border-radius:14px;box-shadow:6px 8px 0 var(--shadow);z-index:20;display:none;padding:4px}
.results.on{display:block}
.results button{all:unset;display:grid;grid-template-columns:62px 1fr;gap:8px;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.results button.hi,.results button:hover{background:var(--surface2)}
.results .k{font:800 11px var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.results .none{padding:8px;color:var(--muted)}
/* main */
main{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;min-width:0;background:var(--bg);touch-action:none;user-select:none}
svg#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
svg#map.drag{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:10px;background:var(--surface);border:2px solid var(--outline);border-radius:12px;padding:7px 11px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 90px);pointer-events:none;box-shadow:4px 5px 0 var(--shadow)}
.legend i{display:inline-block;width:20px;height:7px;border-radius:4px;vertical-align:middle;margin-right:5px}
main.shut aside.panel{display:none}
.infotab{position:absolute;top:10px;right:12px;padding:6px 14px;border:2px solid var(--outline);border-radius:999px;background:var(--surface);font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.zoomlbl{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
aside.panel{flex:none;width:480px;overflow:auto;background:var(--surface);border-left:3px solid var(--outline);padding:16px 18px 28px}
@media (max-width:1250px){aside.panel{width:410px}}
aside.panel.wide{width:min(780px,56vw)}
.plan{font-size:14.5px;line-height:1.55}
.panel .plan h1{font:800 26px/1.1 var(--head);margin:.2em 0 .3em}
.panel .plan h2{font:800 18px/1.2 var(--head);letter-spacing:.04em;text-transform:uppercase;margin:1.4em 0 .4em;padding-top:.6em;border-top:2px solid var(--line)}
.panel .plan h3{font:700 16px/1.3 var(--head);margin:1.1em 0 .3em}
.plan ul,.plan ol{padding-left:1.3em}.plan li{margin:.25em 0}
.plan code{font:13px ui-monospace,Consolas,monospace;background:var(--surface2);padding:1px 5px;border-radius:4px}
.plan .tbl{overflow-x:auto;margin:.7em 0}
.plan table{border-collapse:collapse;width:100%;font-size:13.5px}
.plan th,.plan td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
.plan th{font:700 11.5px/1.2 var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.howto{margin-top:18px;border-top:2px solid var(--line);padding-top:10px}
details.howto>summary{font:800 15px/1.2 var(--head);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.panel h2{font:800 28px/1.08 var(--head);margin:0 0 6px;letter-spacing:.01em}
.panel h3{font:800 13px var(--head);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.panel h3 .key{width:22px;height:8px;border-radius:4px;display:inline-block}
.panel p{margin:0 0 9px}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;border:1.5px solid var(--line);color:var(--muted);background:var(--surface2)}
.tag.ok{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.tag.warn{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.intro{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;margin:4px 0 6px}
.intro.solo{grid-template-columns:1fr}
.tag.bad{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.flagbox{border:3px solid var(--flag);background:var(--badbg);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:14px;margin:12px 0 6px}
.flagbox b{font-weight:800;color:var(--bad)}
.flagbox ul{margin:6px 0 4px 18px;padding:0}
.flagbox li{margin:2px 0}
.flagbox p{margin:6px 0 0;color:var(--muted);font-size:13px}
.intro img{width:150px;height:120px;object-fit:contain;background:#fff;border-radius:12px;border:3px solid var(--outline);box-shadow:4px 5px 0 var(--shadow)}
.intro .np{width:150px;height:120px;border-radius:12px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;color:var(--muted);padding:8px;line-height:1.3}
.intro .np b{font-family:Consolas,monospace;font-size:11.5px;color:var(--ink);word-break:break-all}
.what{font-size:17px;line-height:1.35;font-weight:600;margin:0 0 6px}
.pn{font-size:13px;color:var(--muted);margin:0}
a.ext{color:var(--armor);text-decoration:none;font-weight:700}
a.ext:hover{text-decoration:underline}
.ask{border:3px dashed var(--warn);background:var(--warnbg);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:14px;margin:12px 0 4px}
.ask b{font-weight:800}
.warnbox{border-left:5px solid var(--armor);padding:7px 10px;background:var(--armor-fill);font-size:14px;margin:0 0 10px;border-radius:0 10px 10px 0}
.note{color:var(--muted);font-size:12.5px}
/* the pins, one by one - the most important thing in the panel */
.pins{display:flex;flex-direction:column;gap:9px}
.pin{border:3px solid var(--outline);border-radius:14px;background:var(--surface);box-shadow:4px 5px 0 var(--shadow);overflow:hidden}
.pin.hit{border-color:var(--sel);box-shadow:0 0 0 3px var(--sel),4px 5px 0 var(--shadow)}
.pin.dim{opacity:.38}
.pinhead{display:flex;align-items:baseline;gap:8px;padding:7px 11px 5px;background:var(--surface2);border-bottom:2px solid var(--line)}
.pinhead .pid{font:800 17px var(--head);letter-spacing:.02em}
.pinhead .plabel{font-size:12.5px;color:var(--muted);min-width:0}
.pinwire{all:unset;box-sizing:border-box;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;padding:8px 11px;cursor:pointer;border-top:1px solid var(--line)}
.pinwire:first-of-type{border-top:0}
.pinwire:hover{background:var(--bg)}
.pinwire .bar{height:10px;border-radius:5px}
.pinwire .bar.white{box-shadow:0 0 0 1.5px #9AA3AC inset}
.pinwire .dest{font-size:14.5px;line-height:1.3;min-width:0}
.pinwire .dest b{font-weight:800}
.pinwire .dest .pl{color:var(--muted);font-size:12.5px}
.pinwire .meta{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pinwire .go{font-size:12px;font-weight:700;color:var(--armor);white-space:nowrap}

/* paths */
.path{list-style:none;margin:0 0 6px;padding:0;position:relative}

.pathhead{font-size:13px;margin:8px 0 4px}
.sw{width:22px;height:8px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:6px}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:2px solid var(--outline);background:var(--surface2);border-radius:10px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:700;box-shadow:3px 4px 0 var(--shadow)}

.wirehead .big{width:56px;height:14px;border-radius:7px}
/* Toby's colour picker (2026-10-11): pick the colour of the real wire; saved into design/wire-colours.json */
.cpick{margin:0 0 12px;padding:8px 10px 6px;border:2px solid var(--line);border-radius:10px;background:var(--surface2)}
.cplab{font-weight:800;font-size:12.5px;margin-bottom:6px}
.cpsw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.csw.white{border-color:#9AA3AC}
.csw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}

.ccust.on{outline:3px solid var(--ink);outline-offset:1px}
.ccust input{width:30px;height:30px;border:none;padding:0;background:none;cursor:pointer}
.cpstate{margin:8px 0 2px;font-size:12.5px}
.cpstate.pend{color:var(--ink);background:rgba(242,197,17,.22);border-radius:6px;padding:4px 6px}
.pendtag{font-size:11px;font-weight:800;background:rgba(242,197,17,.35);border-radius:5px;padding:1px 5px}
.ycols li{margin-bottom:4px}
.filtnote{margin:6px 0 8px;padding:6px 10px;border-radius:8px;background:var(--surface2);font-size:13px}
.filtnote.none{background:rgba(242,197,17,.25)}
/* wired ticks (2026-10-13) */
.wiredrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.wiredbtn{border:2px solid var(--outline);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 14px;font-weight:800;font-size:14px;cursor:pointer}
.wiredbtn.on{background:#2A9D3F;border-color:#1E7A30;color:#fff}
.wiredbtn.small{padding:3px 10px;font-size:13px}
.wiredsum{margin:6px 0 10px}
.wiredmark{pointer-events:none}
.wiredmark circle{fill:#2A9D3F;stroke:var(--bg);stroke-width:4}
.wiredmark .tick{stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.jointnote{margin:6px 0 8px;padding:7px 10px;border-radius:8px;background:var(--surface2);border-left:5px solid var(--dotring);font-size:13px}
.cmark{cursor:pointer}
.cmark .cmk{fill:var(--surface);stroke-width:3}
.cmark .cmt{font:800 15px var(--body);fill:var(--ink);pointer-events:none}
.ends{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;margin:4px 0 10px}
.ends button{all:unset;cursor:pointer;border-radius:10px;padding:6px 9px;background:var(--bg);font-size:14px;border:2px solid var(--line)}
.ends button:hover{border-color:var(--outline)}
.ends .k{color:var(--muted);font-size:12.5px;padding-top:7px;font-weight:600}
.srcbox{font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px;background:var(--bg);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;color:var(--muted);margin:0 0 8px}
.rep{list-style:none;margin:0;padding:0;font-size:13px}
.rep li{padding:5px 8px;border-radius:8px;margin-bottom:3px}
.rep li.fail{background:var(--badbg);color:var(--bad)}
.rep li.warn{background:var(--warnbg);color:var(--warn)}
.rep li.pass{color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin:8px 0;font-weight:600}
/* the main view of a part (Toby, 2026-10-07): photo, the pin diagram, one plain sentence; the rest under Details */
.photo{display:flex;justify-content:center;margin:2px 0 8px}
.photo img{width:260px;height:180px;object-fit:contain;background:#fff;border-radius:14px;border:3px solid var(--outline);box-shadow:4px 5px 0 var(--shadow)}
.photo .np{width:260px;height:96px;border-radius:12px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;color:var(--muted);padding:8px;line-height:1.3}
.photo .np b{font-family:Consolas,monospace;font-size:11.5px;color:var(--ink);word-break:break-all}
.diag{background:var(--bg);border-radius:12px;padding:6px;margin:4px 0 4px}
.dkey{font-size:11.5px;color:var(--muted);margin:0 0 10px 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dkey .k1,.dkey .k2{display:inline-block;width:28px;height:0;border-top:4px solid var(--ink);vertical-align:middle}

.art{background:var(--bg);border-radius:12px;padding:6px;margin:2px 0 4px}
.art svg{width:100%;height:auto;display:block}
.artcap{font-size:12px;color:var(--muted);margin:2px 4px 10px;line-height:1.4}
.artcap b{color:var(--ink)}
.where{font-size:13px;margin:0 4px 10px}
ol.howto{margin:4px 0 10px;padding-left:22px;font-size:13px;line-height:1.45}
ol.howto li{margin:3px 0}
.part.chip .body{stroke-width:2.5}
.part .chipref{font-family:var(--head);font-weight:800;pointer-events:none}
.part .chipval{font-family:var(--body);font-weight:700;pointer-events:none}
.diag svg{width:100%;height:auto;display:block}
.diag .far,.diag .dw{cursor:pointer}
.diag .far:hover rect{stroke:var(--sel);stroke-width:3}
.diag .dw:hover .dwl{stroke-width:10}
.diag .dc{cursor:pointer}
.diag .dc:hover .dcb{stroke:var(--sel)}
.sym{cursor:pointer}
.sym .sympill{fill:var(--sympill);stroke:var(--outline);stroke-width:2}
.sym .symink{fill:none;stroke:var(--symink);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}
.sym .symlead{fill:none;stroke:var(--symlead);stroke-width:3.4;stroke-linecap:round}
.sym .symdot{fill:var(--symlead)}
.sym .symlab{fill:var(--ink);font-weight:800;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
#map:not(.focus):not(.fewcomps) .sym .symlab{display:none}   /* values only once a part or a wire is picked: with everything shown they would cover each other - except on a small design (fewcomps), where they all fit */
.sym:hover .sympill{stroke:var(--sel);stroke-width:4}
p.comps{margin:8px 0 2px;font-size:14px;line-height:1.5}
.clist{margin:4px 0 8px 18px;padding:0;font-size:14px}
.clist li{margin:3px 0}
button.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline dotted;font:inherit}
.dkey svg{vertical-align:-2px;color:var(--ink)}
p.comps b{font-weight:800}
.wfacts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 6px;font-size:15px}
.wfacts dt{color:var(--muted);font-weight:700}
.wfacts dd{margin:0;font-weight:700}
.wfacts dd .src{font-weight:400}
.wfrom{font-size:16px;line-height:1.4;margin:6px 0 4px}
.wfrom button{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:800;color:var(--ink);text-decoration:underline dotted}
details.more{margin-top:12px;border-top:2px solid var(--line)}
details.more>summary{font:800 14px var(--head);text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin:10px 0 8px}
details.more>summary:hover{color:var(--armor)}
.kbd{font-family:Consolas,monospace;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface2)}
/* svg */
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln.white{filter:drop-shadow(0 1.5px 2.2px rgba(0,0,0,.55))}   /* CSS, not an SVG filter: an SVG filter region is cut from the path's own box, so a dead-straight white wire (a zero-width box) vanished */
.hit{fill:none;stroke:transparent;pointer-events:stroke;cursor:pointer}
.part{cursor:pointer}
.part .shadow{fill:var(--shadow)}
.part .body{stroke:var(--outline);stroke-width:5}
.part.dot .dothit{fill:transparent}
.part.dot .dotc{fill:var(--dot);stroke:var(--dotring);stroke-width:6}
.part.dot .dotflag{fill:none;stroke:var(--flag);stroke-width:7}
.part.dot .dotl{font-family:var(--head);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--arm-fill);stroke-width:6px;stroke-linejoin:round}
.part.dot:hover .dotc{stroke-width:9}
.part.dot.sel .dotc{stroke:var(--sel);stroke-width:10}
.part.bar .dothit{fill:transparent}
.part.bar .barc,.part.bar .barend{fill:var(--dot);stroke:var(--dotring);stroke-width:5}
.part.bar .tap{stroke:var(--dotring);stroke-width:3}
.part.bar .dotflag{fill:none;stroke:var(--flag);stroke-width:7}
.part.bar:hover .barc{stroke-width:8}
.part.bar.sel .barc,.part.bar.sel .barend{stroke:var(--sel);stroke-width:9}
.part.sel .body{stroke:var(--sel);stroke-width:10}
.part:hover .body{stroke-width:8}
.part.faded{opacity:.16}
/* Pictures Off / On: each box with a photo carries both drawings, the map's class picks one */
#map.pics .bx-plain, #map:not(.pics) .bx-pics { display: none; }
/* Between selected (2026-10-09): the picked parts, and the note on a splice whose other taps are hidden */
.part.picked .body{stroke:var(--sel);stroke-width:12}
.part.picked .shadow{fill:var(--sel);opacity:.6}
.tapnote rect{fill:var(--surface);stroke:var(--muted);stroke-width:2;stroke-dasharray:6 4}
.leglink path{fill:none;stroke:var(--ink);stroke-width:4;stroke-dasharray:11 8;opacity:.8;pointer-events:none}
.leglink circle{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.leglink text{font-family:var(--head);font-weight:800;fill:var(--ink);text-anchor:middle}
.tapnote text{font-family:var(--body);font-weight:700;fill:var(--muted);text-anchor:middle}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.picks .pk{display:inline-flex;align-items:center;gap:2px;border:2px solid var(--sel);border-radius:999px;padding:2px 4px 2px 12px;background:var(--surface2);font-size:13.5px}
.picks .pk .x{border:0;background:transparent;cursor:pointer;font-size:17px;font-weight:800;line-height:1;color:var(--muted);padding:0 6px}
.picks .pk .x:hover{color:var(--bad)}
.bpaths{list-style:none;margin:4px 0 12px;padding:0;font-size:13.5px}
.bpaths li{margin:0 0 6px;padding:7px 10px;background:var(--bg);border-radius:10px;line-height:1.6}
.part .nm{font-family:var(--head);font-weight:800;pointer-events:none}
.part .pnl{font-family:var(--body);font-weight:600;pointer-events:none}
.part .q circle{fill:var(--warnbg);stroke:var(--warn);stroke-width:4}
.part .q text{font-family:var(--head);font-weight:800;fill:var(--warn);text-anchor:middle}
.zl{font-family:var(--head);font-weight:800;fill:var(--muted);letter-spacing:.08em;pointer-events:none}
.zn{font-family:var(--body);fill:var(--muted);pointer-events:none}
.ol{fill:none;stroke:var(--muted);stroke-width:4;stroke-dasharray:14 10;opacity:.75}
.oln{font-family:var(--body);font-weight:700;fill:var(--muted);pointer-events:none}
.zl,.zn,.oln{paint-order:stroke;stroke:var(--arm-fill);stroke-width:7px;stroke-linejoin:round}
.endlab{font-family:var(--head);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--arm-fill);stroke-width:6px;stroke-linejoin:round;pointer-events:none}

.endpin{fill:var(--ink);stroke:var(--arm-fill);stroke-width:3}
.pintag rect{fill:var(--surface);stroke:var(--outline);stroke-width:2}
.pintag text{font-family:var(--head);font-weight:800;fill:var(--ink)}
.endtag rect{fill:var(--surface);stroke:var(--sel);stroke-width:4}
.endtag text{font-family:var(--head);font-weight:800;fill:var(--ink)}
.stepno circle{fill:var(--pwr);stroke:var(--outline);stroke-width:3}
.stepno.g circle{fill:var(--gnd)}
.stepno text{font-family:var(--head);font-weight:800;fill:#111;text-anchor:middle}

.netchip{display:inline-flex;align-items:center;border:0;border-radius:999px;padding:0 9px;font:800 12px/1.6 var(--body);cursor:pointer;white-space:nowrap;vertical-align:baseline}

.netchip.big{font-size:14px;padding:2px 12px}
.diag .dn{cursor:pointer}
.diag .dn:hover rect{stroke:var(--sel);stroke-width:2.5}
.legs{list-style:none;margin:4px 0 10px;padding:0;font-size:14px}
.legs li{margin:0 0 7px;padding:7px 10px;background:var(--bg);border-radius:10px;line-height:1.45}
.legs li b.leg{font:800 13px var(--head);text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.zb{display:inline-block;font:800 11.5px var(--head);text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:1px 8px;margin-right:6px;vertical-align:1px}

.pgintro{font-size:14px;margin:0 0 10px}
.sect{font:800 15px var(--head);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 6px;padding:6px 10px;background:var(--ink);color:var(--surface);border-radius:8px}

ol.steps{list-style:none;margin:0;padding:0}

<body>
<header class="top">
  <a id="designs" style="display:none"></a>
