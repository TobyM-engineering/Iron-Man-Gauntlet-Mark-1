B**; the firmware probes 0x4A and 0x4B, 00 #27) | 22 | green / black | F"},{"id":"N5","rows":["E7"],"pin":"fbno.RST","text":"open","src":"E7 | 3V3 bus / the ESP32 ground splice | forearm BNO08X **VCC / GND** — four wires and nothing else (Toby, 2026-10-07: the bench ran both on four wires): no capacitor added (the board carries its own) and **no straps** — AD0, PS0, PS1, CS and RST open, the board's defaults = I2C at the board's own address (the bench pair answered **0x4B**; the firmware probes 0x4A and 0x4B, 00 #27) | 22 | green / black | F"},{"id":"N6","rows":["E7"],"pin":"fbno.AD0","text":"open: no strap (Toby, 2026-10-07: the bench ran both boards on four wires) - the board's own address, 0x4B on the bench pair (00 #27)","src":"E7 | 3V3 bus / the ESP32 ground splice | forearm BNO08X **VCC / GND** — four wires and nothing else (Toby, 2026-10-07: the bench ran both on four wires): no capacitor added (the board carries its own) and **no straps** — AD0, PS0, PS1, CS and RST open, the board's defaults = I2C at the board's own address (the bench pair answered **0x4B**; the firmware probes 0x4A and 0x4B, 00 #27) | 22 | green / black | F"},{"id":"N7","rows":["E7"],"pin":"fbno.PS0","text":"open: the board's default (I2C)","src":"E7 | 3V3 bus / the ESP32 ground splice | forearm BNO08X **VCC / GND** — four wires and nothing else (Toby, 2026-10-07: the bench ran both on four wires): no capacitor added (the board carries its own) and **no straps** — AD0, PS0, PS1, CS and RST open, the board's defaults = I2C at the board's own address (the bench pair answered **0x4B**; the firmware probes 0x4A and 0x4B, 00 #27) | 22 | green / black | F"},{"id":"N8","rows":["E7"],"pin":"fbno.PS1","text":"open: the board's default (I2C)","src":"E7 | 3V3 bus / the ESP32 ground splice | forearm BNO08X **VCC / GND** — four wires and nothing else (Toby, 2026-10-07: the bench ran both on four wires): no capacitor added (the board carries its own) and **no straps** — AD0, PS0, PS1, CS and RST open, the board's defaults = I2C at the board's own address (the bench pair answered **0x4B**; the firmware probes 0x4A and 0x4B, 00 #27) | 22 | green / black | F"},{"id":"N9","rows":["S10"],"pin":"strip.DOUT","text":"nothing: the chain ends at the strip's last pixel (99), at its end","src":"S10 | Strip **DIN** | from E10 (elbow end; pixel 0 at the elbow, data flows to the wrist; the strip's DOUT at the wrist end goes nowhere) | — | — | F"},{"id":"N10","rows":["L6"],"pin":"modesw.P2A","text":"row 2 (the second pole): not used","src":"L6 | Mode switch | E17–E19 | Ruiwaer ON-OFF-ON DPDT slide switch, 6 pins in two rows of three (Toby measured, 2026-10-07): each row is one pole, its middle pin the common; one end joins the common to one outer pin, the middle position joins nothing, the other end joins the other outer pin. **Row 1 used**: one outer pin → GPIO 36 (E17), the middle pin → the ESP32 ground bus (E19), the other outer pin → GPIO 39 (E18); **row 2 empty**. The pull-ups R12 / R13 (10 kΩ to 3.3 V) and the 100 nF C5 / C6 sit at the ESP32 (§13): 36 and 39 have no internal pull-ups. **Positions (Toby, 2026-10-08, reordered): the middle = SAFE** (both pins high), **the GPIO 36 end = SHOW** (36 low), **the GPIO 39 end = FULL** (39 low); both low reads SAFE. So a broken wire to either end, a lost common or a bad contact reads both high = SAFE, never a live mode; SHOW ↔ FULL passes the middle = SAFE while the lever is there; power-up stays SAFE until the middle has been seen once. The rules are 07's table. **It sits in a printed cover / recess** (Toby's CAD) so a sleeve or a hand cannot slide it by accident"},{"id":"N11","rows":["L6"],"pin":"modesw.P2C","text":"row 2's middle pin: not used","src":"L6 | Mode switch | E17–E19 | Ruiwaer ON-OFF-ON DPDT slide switch, 6 pins in two rows of three (Toby measured, 2026-10-07): each row is one pole, its middle pin the common; one end joins the common to one outer pin, the middle position joins nothing, the other end joins the other outer pin. **Row 1 used**: one outer pin → GPIO 36 (E17), the middle pin → the ESP32 ground bus (E19), the other outer pin → GPIO 39 (E18); **row 2 empty**. The pull-ups R12 / R13 (10 kΩ to 3.3 V) and the 100 nF C5 / C6 sit at the ESP32 (§13): 36 and 39 have no internal pull-ups. **Positions (Toby, 2026-10-08, reordered): the middle = SAFE** (both pins high), **the GPIO 36 end = SHOW** (36 low), **the GPIO 39 end = FULL** (39 low); both low reads SAFE. So a broken wire to either end, a lost common or a bad contact reads both high = SAFE, never a live mode; SHOW ↔ FULL passes the middle = SAFE while the lever is there; power-up stays SAFE until the middle has been seen once. The rules are 07's table. **It sits in a printed cover / recess** (Toby's CAD) so a sleeve or a hand cannot slide it by accident"},{"id":"N12","rows":["L6"],"pin":"modesw.P2B","text":"row 2: not used","src":"L6 | Mode switch | E17–E19 | Ruiwaer ON-OFF-ON DPDT slide switch, 6 pins in two rows of three (Toby measured, 2026-10-07): each row is one pole, its middle pin the common; one end joins the common to one outer pin, the middle position joins nothing, the other end joins the other outer pin. **Row 1 used**: one outer pin → GPIO 36 (E17), the middle pin → the ESP32 ground bus (E19), the other outer pin → GPIO 39 (E18); **row 2 empty**. The pull-ups R12 / R13 (10 kΩ to 3.3 V) and the 100 nF C5 / C6 sit at the ESP32 (§13): 36 and 39 have no internal pull-ups. **Positions (Toby, 2026-10-08, reordered): the middle = SAFE** (both pins high), **the GPIO 36 end = SHOW** (36 low), **the GPIO 39 end = FULL** (39 low); both low reads SAFE. So a broken wire to either end, a lost common or a bad contact reads both high = SAFE, never a live mode; SHOW ↔ FULL passes the middle = SAFE while the lever is there; power-up stays SAFE until the middle has been seen once. The rules are 07's table. **It sits in a printed cover / recess** (Toby's CAD) so a sleeve or a hand cannot slide it by accident"},{"id":"N13","rows":["S19"],"pin":"ina.A1","text":"open: the A1 pad stays unbridged","src":"S19 | INA219 **SDA / SCL** | bus 1 (E5 / E6), address **0x41**: on the HiLetgo board bridge the solder jumper marked **A0** (under \"I2C Address\") with a blob of solder; A1 stays open (0x40 is the PCA9685; 0x70 its all-call). The bring-up scan proves it (05 step 3) | 22 | blue / yellow | F"},{"id":"N14","rows":["S20"],"pin":"ina.VINP","text":"the shunt between VIN+ and VIN-: the board's stock 0.1 ohm (R100), kept (Toby, 2026-10-07) - it reads to 3.2 A, above both stall limits; 0.17 V in a normal cascade (config INA219_SHUNT_OHM 0.1)","src":"S20 | INA219 shunt | **the HiLetgo board's stock 0.1 Ω (R100), kept** (Toby, 2026-10-07; config `INA219_SHUNT_OHM` 0.1). It reads to 3.2 A, above both stall limits (0.6 A held, 2.5 A moving); a normal cascade (1.72 A, 01 §3 case C) drops 0.17 V across it; all six stalled with the ring on (a fault, 5.1 A) would drop 0.51 V for the 300 ms before the release and read 3.2 A (clipped) — still over both limits, so the release still fires | — | — | F"},{"id":"N15","rows":["S13"],"pin":"pca.CH8","text":"spare: the vibration motor is on the DRV2605L over I2C","src":"S13 | PCA9685 ch8 | **spare** — the vibration motor moved to the DRV2605L on bus 2 (§9) | — | — | F"},{"id":"N16","rows":["S16","S21"],"pin":"pca.CH12","text":"its signal pin is spare; the V+ and GND pins of ch 4's header feed the palm ring (S21: W40, W41)","src":"S16 | PCA9685 ch2, ch3, ch4, ch6 | ch4's **V+** and **GND** pins feed the palm ring (S21), its signal pin is spare; ch2, ch3 and ch6 **spare** — no wire | — | — | F"},{"id":"N17","rows":["S16"],"pin":"pca.CH13","text":"spare - no wire","src":"S16 | PCA9685 ch2, ch3, ch4, ch6 | ch4's **V+** and **GND** pins feed the palm ring (S21), its signal pin is spare; ch2, ch3 and ch6 **spare** — no wire | — | — | F"},{"id":"N18","rows":["S16"],"pin":"pca.CH14","text":"spare - no wire","src":"S16 | PCA9685 ch2, ch3, ch4, ch6 | ch4's **V+** and **GND** pins feed the palm ring (S21), its signal pin is spare; ch2, ch3 and ch6 **spare** — no wire | — | — | F"},{"id":"N19","rows":["S16"],"pin":"pca.CH15","text":"spare - no wire","src":"S16 | PCA9685 ch2, ch3, ch4, ch6 | ch4's **V+** and **GND** pins feed the palm ring (S21), its signal pin is spare; ch2, ch3 and ch6 **spare** — no wire | — | — | F"},{"id":"N20","rows":["S15"],"pin":"pca.GNDH","text":"nothing extra on the header ground: E4 is the logic ground; the D4184s' GND inputs stay empty (04 section 5 B8)","src":"S15 | PCA9685 GND (header) | nothing extra (E4 is the logic ground); the D4184s' GND inputs stay empty (§5 B8) | — | — | F"},{"id":"N21","rows":["B8"],"pin":"dmod1.CGND","text":"GND (input side): empty - on this board it is VIN- itself; a wire to the PCA9685's ground would be a second star-to-logic ground path carrying LED-driver current. A meter beeps it to VIN-","src":"B8 | D4184 **GND** (input side) | **empty**: on this board it is VIN− itself, and a wire to the PCA9685's ground would be a second star-to-logic ground path carrying LED driver current through the logic grounds (an opto board with a PC817 would need it on the PCA9685 header GND instead) | — | —"},{"id":"N22","rows":["B8"],"pin":"dmod2.CGND","text":"same as D4184 #1","src":"B8 | D4184 **GND** (input side) | **empty**: on this board it is VIN− itself, and a wire to the PCA9685's ground would be a second star-to-logic ground path carrying LED driver current through the logic grounds (an opto board with a PC817 would need it on the PCA9685 header GND instead) | — | —"},{"id":"N23","rows":["B8"],"pin":"dmod3.CGND","text":"same as D4184 #1","src":"B8 | D4184 **GND** (input side) | **empty**: on this board it is VIN− itself, and a wire to the PCA9685's ground would be a second star-to-logic ground path carrying LED driver current through the logic grounds (an opto board with a PC817 would need it on the PCA9685 header GND instead) | — | —"},{"id":"N24","rows":["A39"],"pin":"lidar.EN","text":"not used: the orange ENABLE lead cut to about 2 cm and insulated on its own under heat-shrink","src":"A39 | LiDAR **orange** (ENABLE) and **yellow** (MODE) leads | not used: each cut to about 2 cm and insulated **on its own** under heat-shrink — never twisted together or onto another wire (left open, the sensor stays enabled; 05 checks it ranges) | — | —"},{"id":"N25","rows":["A39"],"pin":"lidar.MODE","text":"not used: the yellow MODE lead cut to about 2 cm and insulated on its own under heat-shrink","src":"A39 | LiDAR **orange** (ENABLE) and **yellow** (MODE) leads | not used: each cut to about 2 cm and insulated **on its own** under heat-shrink — never twisted together or onto another wire (left open, the sensor stays enabled; 05 checks it ranges) | — | —"},{"id":"N26","rows":["H2"],"pin":"display.H2","text":"VSYS - NEVER connected: with no USB plugged in, the board's Q2 P-FET puts VSYS on the MX1.25 battery port. The screen is powered through its USB-C (P21 / P22)","src":"2 | **VSYS** | **never connected — leave it open.** 5 V on VSYS reaches the MX1.25 battery port: the board's Q2 (AO3401 P-FET, source on VSYS, drain on the battery, gate on USB VBUS with 100 kΩ to ground) is ON whenever no USB is plugged in (Waveshare's schematic, read 2026-10-07). The screen is powered through its USB-C instead"},{"id":"N27","rows":["H3"],"pin":"display.H3","text":"RESET - spare, leave open","src":"3 | RESET | **spare** — leave open"},{"id":"N28","rows":["H4"],"pin":"display.H4","text":"BOOT (GPIO0) - spare, leave open","src":"4 | BOOT (GPIO0) | **spare** — leave open"},{"id":"N29","rows":["H11"],"pin":"display.H11","text":"GPIO21 - spare","src":"11 | GPIO21 | **spare**"},{"id":"N30","rows":["H12"],"pin":"display.H12","text":"GPIO33 - spare (free on this R2 board)","src":"12 | GPIO33 | **spare** (keep it for last — PSRAM-adjacent on some S3 variants; free on this R2 board)"},{"id":"N31","rows":["L3"],"pin":"glaser.HOUSING","text":"insulated with heat-shrink: the Quarton housing is at V+; the pod is plastic","src":"L3 | Laser housing | insulated with heat-shrink; it is at V+ (Quarton). The pod is plastic | —"},{"id":"N32","rows":["L8"],"pin":"glfet.TAB","text":"the tab is the drain = the laser - node: an insulating pad between it and the laser housing (V+)","src":"L8 | RFP30N06LE (pod) | G ← S11 through **1 kΩ**, **100 kΩ G–S pull-down**, D → laser (−) (L2), **S → star ground** (the servo ground, 22 AWG black); tab = drain = the laser's − node - keep it off the laser housing (V+) | logic-level N-FET (Vgs(th) 1–2 V, ~50 mΩ at 3.3 V): 5 mV at 50 mA, no heatsink. One of the arm's five MOSFETs"},{"id":"N33","rows":["L7","P6"],"pin":"mastersw.P1","text":"the master switch = P6-P7: the Ruiwaer slide switch pulling the IRF4905's gate to ground","src":"L7 | Master switch | P6–P7 | Ruiwaer slide switch, 3 pins in a row (Toby measured, 2026-10-07): the middle pin is the common and joins one outer pin or the other. Middle → the star (P7), one outer pin → the IRF4905 gate (P6), the other outer pin empty; microamps"},{"id":"N34","rows":["P7","L7"],"pin":"mastersw.P3","text":"empty: slid toward this pin the gate floats on R1 and the arm is off; wiring the two outer pins together would never connect","src":"P7 | Master slide switch, its **middle pin** (the common) | STAR. The other outer pin stays empty: slid toward the wired outer pin = on, the other way = the gate floats on its 100 kΩ = off. Two outer pins wired would never connect | 22 | black | F"},{"id":"N35","rows":["A30"],"pin":"hbno.CS","text":"open: the SPI select, pulled up on the board","src":"A30 | hand BNO08X **CS** and **RST** | open (CS is pulled up on the board) | — | —"},{"id":"N36","rows":["A30"],"pin":"hbno.RST","text":"open","src":"A30 | hand BNO08X **CS** and **RST** | open (CS is pulled up on the board) | — | —"},{"id":"N37","rows":["A29"],"pin":"hbno.AD0","text":"open: no strap (Toby, 2026-10-07) - the board's own address, 0x4B on the bench pair (00 #27)","src":"A29 | hand BNO08X **AD0, PS0, PS1** | open — no straps, the board's defaults (Toby, 2026-10-07): I2C at the board's own address (the bench pair answered 0x4B; the firmware probes 0x4A and 0x4B, 00 #27) | — | —"},{"id":"N38","rows":["A29"],"pin":"hbno.PS0","text":"open: the board's default (I2C)","src":"A29 | hand BNO08X **AD0, PS0, PS1** | open — no straps, the board's defaults (Toby, 2026-10-07): I2C at the board's own address (the bench pair answered 0x4B; the firmware probes 0x4A and 0x4B, 00 #27) | — | —"},{"id":"N39","rows":["A29"],"pin":"hbno.PS1","text":"open: the board's default (I2C)","src":"A29 | hand BNO08X **AD0, PS0, PS1** | open — no straps, the board's defaults (Toby, 2026-10-07): I2C at the board's own address (the bench pair answered 0x4B; the firmware probes 0x4A and 0x4B, 00 #27) | — | —"},{"id":"N40","rows":["A32"],"pin":"drv2605.EN","text":"open: the breakout pulls EN up","src":"A32 | DRV2605L **EN** and **IN/TRIG** | open: the breakout pulls EN up; I2C real-time playback, no trigger wire | — | —"},{"id":"N41","rows":["A32"],"pin":"drv2605.IN","text":"open: I2C real-time playback, no trigger wire","src":"A32 | DRV2605L **EN** and **IN/TRIG** | open: the breakout pulls EN up; I2C real-time playback, no trigger wire | — | —"},{"id":"N42","rows":["A33"],"pin":"disc.DOUT","text":"nothing: the chain ends at the disc's last pixel (18)","src":"A33 | inner disc **DOUT** | nothing — the chain ends at the disc's last pixel (18) | — | —"}],"rows":[{"id":"P1","section":"P","text":"P1 | Battery XT30 (+), 16 AWG pigtail (Hiteuoms Amass XT30, 100 mm) | Fuse holder lead A (**the kit's 16 AWG holder**, ThsGivingStore), soldered splice under adhesive heat-shrink | 16 (the parts' own leads) | red | F"},{"id":"P2","section":"P","text":"P2 | Fuse holder lead B (16 AWG) | IRF4905 **source** (pin 3) | 16 | red | F"},{"id":"P3","section":"P","text":"P3 | Battery XT30 (−), 16 AWG pigtail | **STAR** | 16 | black | F"},{"id":"P4","section":"P","text":"P4 | IRF4905 **gate** | **100 kΩ to the IRF4905 source** (the pull-up: off until the switch pulls the gate down). No soft-start capacitor: the switch shorts the gate straight to the star, a cap there would charge at once (the audit, 2026-10-07) | — | — | F"},{"id":"P5","section":"P","text":"P5 | IRF4905 **drain** (pin 2 + tab) | the **RAW bus** splice | 20 | yellow | F"},{"id":"P6","section":"P","text":"P6 | Master slide switch (Ruiwaer: a 3-pin single-pole slide switch, Toby's photo of 2026-10-07), **an outer pin** | IRF4905 **gate** — the switch pulls the gate to ground; it carries the pull-up's 90 µA, nothing more | 22 | white | F"},{"id":"P7","section":"P","text":"P7 | Master slide switch, its **middle pin** (the common) | STAR. The other outer pin stays empty: slid toward the wired outer pin = on, the other way = the gate floats on its 100 kΩ = off. Two outer pins wired would never connect | 22 | black | F"},{"id":"P8","section":"P","text":"P8 | IRF4905 **tab** | live (RAW): heat-shrink or tape over it. A clip-on TO-220 heatsink **only if** the closed rehearsal (05) finds the FET hot — on an insulating pad, with a shoulder washer if a metal screw holds it | — | — | F"},{"id":"P9","section":"P","text":"P9 | RAW bus | D24V50F5 **VIN** | 20 | yellow | F"},{"id":"P10","section":"P","text":"P10 | D24V50F5 **GND** — one of its two GND holes (Pololu: \"2x ground\" — one connection on the board, so one wire) | STAR | 20 | black | F"},{"id":"P11","section":"P","text":"P11 | D24V50F5 **VOUT** | the **SERVO rail** splice; the 1000 µF 16 V across the regulator's VOUT and GND pins (stripe to GND) | 20 | red | F"},{"id":"P12","section":"P","text":"P12 | RAW bus | D24V22F5 **VIN** | 20 | yellow | F"},{"id":"P13","section":"P","text":"P13 | D24V22F5 **GND** | STAR | 20 | black | F"},{"id":"P14","section":"P","text":"P14 | D24V22F5 **VOUT** | the **LOGIC rail** splice; the 100 µF across the regulator's VOUT and GND pins | 20 | red | F"},{"id":"P15","section":"P","text":"P15 | EN pins of both regulators | open (nothing) | — | — | F"},{"id":"P16","section":"P","text":"P16 | RAW bus | a yellow 22 AWG wire to R2 (100 kΩ) → the divider node splice → R3 (22 kΩ) → a black 22 AWG wire to the STAR; the node → GPIO 35 by the white wire E20, its 100 nF (C4) at the ESP32's pin (§13; 8.7 V full LiHV pack → 1.57 V at the pin). **Rebuilt for LiHV: the two resistors in line with short leads, both bodies, the node and the node wire under one adhesive-lined heat-shrink sleeve** (the 2026-09-06 divider snapped a leg; a broken leg reads as a monitor FAULT, not as an empty pack) | 22 | yellow / black / white | F"},{"id":"P18","section":"P","text":"P18 | RAW bus | ELRS module V+ (to the module's own JST-SM 2-pin pigtail) | 20 | yellow | F"},{"id":"P19","section":"P","text":"P19 | ELRS module GND | STAR | 22 | black | F"},{"id":"P20","section":"P","text":"P20 | STAR | the **ESP32 ground** splice (E26) — the one sensor-ground link | 20 | black | F"},{"id":"P21","section":"P","text":"P21 | LOGIC rail | the round screen's **USB-C power plug**, its **red** wire = USB **VBUS** (§6: the screen is powered through its USB-C, never through header pin 2 VSYS); C14 (100 µF) across P21 and P22 at the plug end | 22 | red | F"},{"id":"P22","section":"P","text":"P22 | the round screen's USB-C power plug, its **black** wire = USB **GND** | the **ESP32 ground** splice (E26) — the screen's supply return, beside its UART ground (H1) | 22 | black | F"},{"id":"E1","section":"E","text":"E1 | LOGIC rail | ESP32 **5V/VIN** (100 µF at the pin). A plain wire: the devkit has no diode between its USB VBUS and its 5V pin (05 step 0a, Toby measured 2026-10-08) and none is added - **never USB and the battery on at the same time** | 20 | red | F"},{"id":"E2","section":"E","text":"E2 | ESP32 **3V3** | the **3V3 splice** beside the ESP32: one wire from the pin; E3, E7, E16, S18 and E24 leave from it, and the 3V3 ends of the pull-ups of E5, E6, E17 and E18 join it | 22 | green | F"},{"id":"E3","section":"E","text":"E3 | 3V3 bus | PCA9685 **VCC** | 22 | green | F"},{"id":"E4","section":"E","text":"E4 | the ESP32 ground splice | PCA9685 **header GND** (not the screw block) | 22 | black | F"},{"id":"E5","section":"E","text":"E5 | ESP32 **21** | PCA9685 **SDA**, forearm BNO08X **SDA** and the INA219's SDA (S19); 2.2 kΩ to 3V3 at the ESP32 | 22 | blue | F"},{"id":"E6","section":"E","text":"E6 | ESP32 **22** | PCA9685 **SCL**, forearm BNO08X **SCL** and the INA219's SCL (S19); 2.2 kΩ to 3V3 | 22 | yellow | F"},{"id":"E7","section":"E","text":"E7 | 3V3 bus / the ESP32 ground splice | forearm BNO08X **VCC / GND** — four wires and nothing else (Toby, 2026-10-07: the bench ran both on four wires): no capacitor added (the board carries its own) and **no straps** — AD0, PS0, PS1, CS and RST open, the board's defaults = I2C at the board's own address (the bench pair answered **0x4B**; the firmware probes 0x4A and 0x4B, 00 #27) | 22 | green / black | F"},{"id":"E8","section":"E","text":"E8 | Forearm BNO08X **INT** | ESP32 **32** | 22 | white | F"},{"id":"E9","section":"E","text":"E9 | ESP32 **23** | PCA9685 **OE**; **1 kΩ to 3V3** at the PCA. The Adafruit board's own **R7 is 10 kΩ from OE to GND** (Adafruit's rev C schematic): with 1 kΩ OE sits at about 3.0 V (not 3.3), a solid \"off\" above the PCA9685's 2.31 V high; a 10 kΩ pull-up would only reach 1.65 V, and the lasers and LED groups would be live at boot. 10 kΩ only with R7 removed. On any reset (and the task watchdog resets a loop stuck for 3 s) the pin lets go and the 1 kΩ takes OE high; the firmware writes MODE2 = 0x04 at every boot and reads it back (totem pole, OUTNE = 00: every output LOW while OE is high), so every servo, laser and LED-group input is off | 22 | white | F"},{"id":"E10","section":"E","text":"E10 | ESP32 **13** | 330 Ω (R7, at the ESP32's pin, §13) → arm strip **DIN** at the elbow end — straight from the pin, as the first bench test; keep this wire short | 22 | white | F"},{"id":"E11","section":"E","text":"E11 | ESP32 **27** | 330 Ω (R8, at the ESP32's pin, §13 - like R7) → W21 RING_DATA across the wrist → the outer ring's DIN — straight from the pin, as the first bench test | 22 | white | W"},{"id":"E12","section":"E","text":"E12 | ESP32 **4** | W35 ACCENT → three **270 Ω**, one in line in each LED's lead under heat-shrink → three red 2 mm diffused accent LEDs (Cleiscry), each cathode on the hand ground bus by its own black wire (A34–A36); W35 ends in the accent splice in the palm with the three resistors (R9–R11, §13): ≈ 4.8 mA each, 14 mA from the pin at its highest drive setting (the firmware sets it). GPIO 4 has no boot pulse; it is the pin the LED-branch MOSFET freed | 22 | white | W"},{"id":"E13","section":"E","text":"E13 | ESP32 **25** | ELRS module **CRSF** pad (one wire, no resistor; module GND is at the star) | 22 | white | F"},{"id":"E14","section":"E","text":"E14 | ESP32 **18** (UART2 TX) | **1 kΩ (R23) in line at the ESP32's pin** → S3 header pin 8 **GPIO16** (its RX) — **twisted with E15 and the ground H1** (one three-wire twisted bundle, §6) | 22 | white | F"},{"id":"E15","section":"E","text":"E15 | ESP32 **19** (UART2 RX) | S3 header pin 7 **GPIO15** (its TX) → **1 kΩ (R24) in line at the ESP32's pin** — in the same twisted bundle as E14 and H1. R23 / R24 (2026-10-08, the audit): with one board powered and the other not (one on USB, the puck unplugged) the powered pin cannot push more than about 3 mA into the other's | 22 | white | F"},{"id":"E16","section":"E","text":"E16 | ESP32 **26** | **buzzer module I/O** (MusRock passive buzzer module: 9012 PNP on board, **low-level trigger**, so the firmware idles the pin HIGH and plays its tones on LEDC with the output inverted); module **VCC ← 3V3 bus** (3.3 V, so a 3.3 V HIGH turns the PNP fully off); module **GND → the ESP32 ground splice**. No separate transistor, no diode | 22 | white / green / black | F"},{"id":"E17","section":"E","text":"E17 | ESP32 **36** | mode switch pole A — the **SHOW** end (L6); 10 kΩ to 3V3; 100 nF to GND | 22 | white | F"},{"id":"E18","section":"E","text":"E18 | ESP32 **39** | mode switch pole B — the **FULL** end (L6); 10 kΩ to 3V3; 100 nF to GND | 22 | white | F"},{"id":"E19","section":"E","text":"E19 | Mode switch common | the ESP32 ground splice | 22 | black | F"},{"id":"E20","section":"E","text":"E20 | ESP32 **35** | divider node (P16), 100 nF to GND at the pin | 22 | white | F"},{"id":"E21","section":"E","text":"E21 | ESP32 **34** | W27 THUMB → the thumb flex sensor's low end; **47 kΩ (R14) and 100 nF from the pin to the ESP32 ground splice** | 22 | white | W"},{"id":"E22","section":"E","text":"E22 | ESP32 **16 / 17** | W25 SDA2 / W26 SCL2 — bus 2 across the wrist; **no pull-ups fitted at this end** — the LiDAR v3 brings 3 kΩ (03 §3) | 22 | blue / yellow: SDA2 twisted with W23 (hand 3.3 V), SCL2 with W24 (hand ground), per UM10204 §17.3 | W"},{"id":"E23","section":"E","text":"E23 | ESP32 **33** | W28 HAND_INT | 22 | white | W"},{"id":"E24","section":"E","text":"E24 | 3V3 bus | W23 3V3 (to the hand 3.3 V splice) | 22 | green | W"},{"id":"E25","section":"E","text":"E25 | the ESP32 ground splice | W24 HAND_GND (to the hand ground splice) | 22 | black | W"},{"id":"E26","section":"E","text":"E26 | the **ESP32 ground** splice beside the ESP32 (Toby, 2026-10-07): P20 from the star, E4, E7, E16, E19, E25, S18 and the round screen's two grounds (P22, H1) meet in it, with the ground ends of the capacitors and the thumb divider of E17, E18, E20 and E21 | ESP32 **GND** pin — one wire | 22 | black | F"},{"id":"S1","section":"S","text":"S1 | SERVO rail | **INA219 VIN+** — the whole servo branch passes the INA219 (S17–S20) and then the PCA9685's V+: all six servos and the palm ring, each on its own channel header (S3, S4, S21; the red laser's power left it on 2026-10-08, S12). The strip's feed (S7) and the green laser stay ahead of it. **One wire** (it was two): 5.1 A in the all-stalled fault is 46 % of a 20 AWG's 11 A; in the elbow, under 5 cm, 9 mV (01 §11) | 20 | red | F"},{"id":"S2","section":"S","text":"S2 | PCA9685 **screw-block GND** | STAR — **one wire** (it was two): the return of everything on the PCA9685, the same numbers as S17 | 20 | black | F"},{"id":"S3","section":"S","text":"S3 | PCA9685 ch13 / ch12 / ch14 / ch15 headers | the four forearm servos: plate 1 (ch13), plate 2 (ch12), plate 3 servo A (ch14), plate 3 servo B (ch15) (FFTY MG90S; plug: brown GND toward the board edge, red centre, orange signal) | servo leads | — | F"},{"id":"S4","section":"S","text":"S4 | PCA9685 **ch0** / **ch1** headers — all three pins, exactly like the plates' (Toby, 2026-10-07) | the hand plate's two servos across the wrist, each on its own three wires: ch0 → W19 signal, W36 5 V, W37 GND → servo A (left); ch1 → W20, W38, W39 → servo B (right). Each servo's own lead is extended with 22 AWG, one in-line solder joint per conductor under heat-shrink in the hand | 22 | white / red / black | W"},{"id":"S7","section":"S","text":"S7 | SERVO rail | arm strip **start 5 V** — the elbow end, pixel 0 (1000 µF at this point): the strip's **only feed** (Toby, 2026-10-07: \"one feed only\" — the second pair at its end is gone). Fed from its start, its end sits at about 4.1–4.7 V with all 100 pixels white at the 30 % cap (1.8 A along the strip's own copper, which the listing does not give); 05 step 6 measures it | 20 | red | F"},{"id":"S9","section":"S","text":"S9 | Strip GND, start | STAR — one wire from the strip's start (the elbow end), the partner of S7 | 20 | black | F"},{"id":"S10","section":"S","text":"S10 | Strip **DIN** | from E10 (elbow end; pixel 0 at the elbow, data flows to the wrist; the strip's DOUT at the wrist end goes nowhere) | — | — | F"},{"id":"S11","section":"S","text":"S11 | PCA9685 ch7 | **1 kΩ → gate of the RFP30N06LE** low-side switch in the pod (L2, L8); **100 kΩ gate-to-source** at the FET holds it off at power-on, and OE holds ch7 low until firmware runs. The Quarton VLM-520-74 (servo rail, 50 mA measured - Toby, 2026-10-06) has no input of its own, hence the FET | 22 | white | F"},{"id":"S12","section":"S","text":"S12 | PCA9685 ch5 | W22 LASER_TTL → the #1056's **yellow TTL wire**, on ch 5's **signal pin** only. Its **red** (5 V) and **black** (GND) wires join the LiDAR's 5 V and ground leads beside it on the back of the hand (A37, A38): the **LOGIC** rail through W29 / W30, like the LiDAR (2026-10-08, the audit: on its channel's header, behind the INA219's shunt, it saw about 4.7 V in a cascade — under its **4.8–5.2 V**; on LOGIC it gets about 5.0 V). 35 mA. Adafruit specifies \"pull to 5 V\" for on: **confirm on the bench that the PCA9685's 3.3 V HIGH turns it on** (00 #23). **Fallback** (only if it does not): the plain #1054 (2.8–5.2 V, 25 mA) switched **low-side by a spare RFP30N06LE** in the hand — gate ← W22 through **1 kΩ**, **100 kΩ gate–source**, drain ← the laser's black wire, source → the LiDAR's ground lead (A38's place); its red wire on the LiDAR's 5 V lead as now. **Never on a GPIO**: an ESP32 pin is not 5 V tolerant. Ch 5 high = on either way, no firmware change | 22 | white | W"},{"id":"S13","section":"S","text":"S13 | PCA9685 ch8 | **spare** — the vibration motor moved to the DRV2605L on bus 2 (§9) | — | — | F"},{"id":"S14","section":"S","text":"S14 | PCA9685 ch9 / ch10 / ch11 | **TRIG/PWM of D4184 #1 / #2 / #3**: LED group 1 (the three XM-L2), group 2 (the two palm 10 mm), group 3 (the two finger LEDs), straight (§5 B7). On / off only | 22 | white | F"},{"id":"S15","section":"S","text":"S15 | PCA9685 GND (header) | nothing extra (E4 is the logic ground); the D4184s' GND inputs stay empty (§5 B8) | — | — | F"},{"id":"S16","section":"S","text":"S16 | PCA9685 ch2, ch3, ch4, ch6 | ch4's **V+** and **GND** pins feed the palm ring (S21), its signal pin is spare; ch2, ch3 and ch6 **spare** — no wire | — | — | F"},{"id":"S17","section":"S","text":"S17 | INA219 **VIN−** | PCA9685 **V+ screw terminal** (through the terminal block — the header V+ pins bypass its reverse-polarity FET); the 1000 µF stays at the PCA's terminal. One wire (it was two): everything on the PCA9685 passes it — 1.72 A in a cascade with the ring on (01 §3 case C), 2.1 A with one servo stalled (case F), 5.1 A with all six stalled (a fault: 46 % of 11 A, for the 300 ms before the release). Adafruit gives the board no current rating; its reverse-polarity FET carries it all (01 §3) | 20 | red | F"},{"id":"S18","section":"S","text":"S18 | INA219 **VCC / GND** | the ESP32's 3V3 bus / the **ESP32 ground** splice (its logic side, like every sensor) | 22 | green / black | F"},{"id":"S19","section":"S","text":"S19 | INA219 **SDA / SCL** | bus 1 (E5 / E6), address **0x41**: on the HiLetgo board bridge the solder jumper marked **A0** (under \"I2C Address\") with a blob of solder; A1 stays open (0x40 is the PCA9685; 0x70 its all-call). The bring-up scan proves it (05 step 3) | 22 | blue / yellow | F"},{"id":"S20","section":"S","text":"S20 | INA219 shunt | **the HiLetgo board's stock 0.1 Ω (R100), kept** (Toby, 2026-10-07; config `INA219_SHUNT_OHM` 0.1). It reads to 3.2 A, above both stall limits (0.6 A held, 2.5 A moving); a normal cascade (1.72 A, 01 §3 case C) drops 0.17 V across it; all six stalled with the ring on (a fault, 5.1 A) would drop 0.51 V for the 300 ms before the release and read 3.2 A (clipped) — still over both limits, so the release still fires | — | — | F"},{"id":"S21","section":"S","text":"S21 | PCA9685 **ch4** header, its **V+ / GND** pins | W40 RING_5V / W41 RING_GND → the outer ring's **5 V** / **GND** (100 µF at the ring); the inner disc takes its power from the ring (§9). The ring's own pair (Toby, 2026-10-07: it had shared the hand servos' feed), on the **servo rail behind the INA219**: LEDs stay off the logic rail that feeds the brains, and the stall check subtracts the ring's own draw from the INA219's reading, so the ring stays on the branch the INA219 measures | 22 | red / black | W"},{"id":"B1","section":"B","text":"B1 | the **RAW** splice (battery + after the switch) | **VIN+** of D4184 #1, #2 and #3 — one wire each, straight from the RAW splice (on this board VIN+ only passes through to OUT+). No LED-driver feed splice (Toby, 2026-10-07) | 20 | yellow"},{"id":"B2","section":"B","text":"B2 | D4184 #1–#3 **VIN−** | **STAR** — one wire each, soldered along the star bus wire (§12). No LED-driver return splice | 20 | black"},{"id":"B3","section":"B","text":"B3 | Each LED driver's **Vin+** (red lead) | its group's D4184 **OUT+** (the same copper as VIN+ on the board): LED drivers 1–3 → #1, 6–7 → #2, 4–5 → #3; a group's leads twisted into one bundle per terminal, the strands **bare and untinned** (or in one ferrule) — never solder-tinned into a screw clamp (§14) | 24 (the LED driver's own) | red"},{"id":"B4","section":"B","text":"B4 | Each LED driver's **Vin−** (black lead) | its group's D4184 **OUT−** — a switched return at battery voltage while the group is off, **not a ground**; into the clamp the same way as B3 (bare twisted strands or a ferrule) | 24 (the LED driver's own) | black"},{"id":"B5","section":"B","text":"B5 | Each LED driver's **LED+ / LED−** leads | the wrist wires W1–W14 (§8) | the LED driver's 24 AWG, extended with 22 | red / blue"},{"id":"B6","section":"B","text":"B6 | 100 µF 16 V | across D4184 #1's **VIN+** and **VIN−** terminals, at the bank (the three modules sit side by side on the same two nets, so one capacitor serves all three switch-on spikes) | — | —"},{"id":"B7","section":"B","text":"B7 | D4184 #1 / #2 / #3 **TRIG/PWM** | PCA9685 ch 9 / 10 / 11 (S14), straight | 22 | white"},{"id":"B8","section":"B","text":"B8 | D4184 **GND** (input side) | **empty**: on this board it is VIN− itself, and a wire to the PCA9685's ground would be a second star-to-logic ground path carrying LED driver current through the logic grounds (an opto board with a PC817 would need it on the PCA9685 header GND instead) | — | —"},{"id":"H1","section":"H","text":"1 | GND | → the **ESP32 ground** splice (black, 22 AWG), **twisted with E14 and E15**: the UART's own return, three wires in one twisted bundle (about three twists per 10 cm) from the ESP32 to the header. It was the VSYS return to the star until 2026-10-07; the supply now comes in through the USB-C (P21 / P22, below)"},{"id":"H2","section":"H","text":"2 | **VSYS** | **never connected — leave it open.** 5 V on VSYS reaches the MX1.25 battery port: the board's Q2 (AO3401 P-FET, source on VSYS, drain on the battery, gate on USB VBUS with 100 kΩ to ground) is ON whenever no USB is plugged in (Waveshare's schematic, read 2026-10-07). The screen is powered through its USB-C instead"},{"id":"H3","section":"H","text":"3 | RESET | **spare** — leave open"},{"id":"H4","section":"H","text":"4 | BOOT (GPIO0) | **spare** — leave open"},{"id":"H5","section":"H","text":"5 | GND | → W32 T_GND and the SSD1306's GND (black 22 AWG) — the show bus's ground"},{"id":"H6","section":"H","text":"6 | **3V3** (the buck's output) | → MLX90640 VIN via W31 T_3V3, and the SSD1306 VCC (green 22 AWG). Up to ~1.5 A spare on this rail"},{"id":"H7","section":"H","text":"7 | GPIO15 | **UART TX** → ESP32 GPIO19 (E15), twisted with pin 8's and pin 1's wires"},{"id":"H8","section":"H","text":"8 | GPIO16 | **UART RX** ← ESP32 GPIO18 (E14), twisted with pin 7's and pin 1's wires. **Not GPIO 44 / 43**: those are the S3's UART0, wired to its CH343P USB-serial chip"},{"id":"H9","section":"H","text":"9 | GPIO17 | **I2C SDA — the show bus**: MLX90640 SDA (W33 T_SDA) + SSD1306 SDA; 4.7 kΩ to pin 6's 3V3 at the S3 end"},{"id":"H10","section":"H","text":"10 | GPIO18 | **I2C SCL — the show bus**: MLX90640 SCL (W34 T_SCL) + SSD1306 SCL; 4.7 kΩ to 3V3"},{"id":"H11","section":"H","text":"11 | GPIO21 | **spare**"},{"id":"H12","section":"H","text":"12 | GPIO33 | **spare** (keep it for last — PSRAM-adjacent on some S3 variants; free on this R2 board)"},{"id":"W1","section":"W","text":"W1 | XML1+ | 22 | red | LED driver 1 LED+ | XM-L2 #1 star (+) | 1 A"},{"id":"W2","section":"W","text":"W2 | XML1− | 22 | blue | LED driver 1 LED− | XM-L2 #1 star (−) | 1 A"},{"id":"W3","section":"W","text":"W3 | XML2+ | 22 | red | LED driver 2 LED+ | XM-L2 #2 (+) | 1 A"},{"id":"W4","section":"W","text":"W4 | XML2− | 22 | blue | LED driver 2 LED− | XM-L2 #2 (−) | 1 A"},{"id":"W5","section":"W","text":"W5 | XML3+ | 22 | red | LED driver 3 LED+ | XM-L2 #3 (+) | 1 A"},{"id":"W6","section":"W","text":"W6 | XML3− | 22 | blue | LED driver 3 LED− | XM-L2 #3 (−) | 1 A"},{"id":"W7","section":"W","text":"W7 | PALM1+ | 22 | red | LED driver 6 LED+ | palm 10 mm #1 (+) | 1 A"},{"id":"W8","section":"W","text":"W8 | PALM1− | 22 | blue | LED driver 6 LED− | palm 10 mm #1 (−) | 1 A"},{"id":"W9","section":"W","text":"W9 | PALM2+ | 22 | red | LED driver 7 LED+ | palm 10 mm #2 (+) | 1 A"},{"id":"W10","section":"W","text":"W10 | PALM2− | 22 | blue | LED driver 7 LED− | palm 10 mm #2 (−) | 1 A"},{"id":"W11","section":"W","text":"W11 | INDEX+ | 22 | red | LED driver 4 LED+ | index finger tab 10 mm (+) | 1 A"},{"id":"W12","section":"W","text":"W12 | INDEX− | 22 | blue | LED driver 4 LED− | index finger tab (−) | 1 A"},{"id":"W13","section":"W","text":"W13 | MIDDLE+ | 22 | red | LED driver 5 LED+ | middle finger tab 10 mm (+) | 1 A"},{"id":"W14","section":"W","text":"W14 | MIDDLE− | 22 | blue | LED driver 5 LED− | middle finger tab (−) | 1 A"},{"id":"W19","section":"W","text":"W19 | SRV_A | 22 | white | PCA9685 ch0 | hand plate servo A signal | mA"},{"id":"W20","section":"W","text":"W20 | SRV_B | 22 | white | PCA9685 ch1 | hand plate servo B signal | mA"},{"id":"W21","section":"W","text":"W21 | RING_DATA | 22 | white | ESP32 27, through R8 at the pin | the **outer ring's DIN** — the data comes into the outer ring first: it is pixels 0–11, the inner disc 12–18 (§9). **Twisted with its ground W41** all the way (2026-10-08) | mA"},{"id":"W22","section":"W","text":"W22 | LASER_TTL | 22 | white | PCA9685 ch5 | red laser #1056 yellow TTL wire (00 #23: the 3.3 V level); its 5 V and ground come from the LiDAR's leads (A37, A38) | µA"},{"id":"W23","section":"W","text":"W23 | 3V3 | 22 | green | ESP32 3V3 bus | **hand 3.3 V** splice: hand BNO08X VCC, ADS1115 VDD (each board carries its own capacitors), DRV2605L VIN (100 µF), top of all five flex sensors | 13 mA, 0.13 A with the vibration motor running"},{"id":"W24","section":"W","text":"W24 | HAND_GND | 22 | black | the ESP32 ground splice | **hand ground** bus: hand BNO08X GND, ADS1115 GND (+ its ADDR strap), DRV2605L GND, the four finger dividers' ground ends, the accent LEDs' cathodes | 27 mA (with the accent LEDs), 0.15 A with the motor running"},{"id":"W25","section":"W","text":"W25 | SDA2 | 22 | blue | ESP32 16 | **SDA2** splice: hand BNO08X SDA, ADS1115 SDA, DRV2605L SDA, LiDAR v3 SDA | —"},{"id":"W26","section":"W","text":"W26 | SCL2 | 22 | yellow | ESP32 17 | **SCL2** splice: hand BNO08X SCL, ADS1115 SCL, DRV2605L SCL, LiDAR v3 SCL | —"},{"id":"W27","section":"W","text":"W27 | THUMB | 22 | white | ESP32 34 (47 kΩ and 100 nF at the pin) | thumb flex sensor's low end (its top is 3V3) | µA"},{"id":"W28","section":"W","text":"W28 | HAND_INT | 22 | white | ESP32 33 | hand BNO08X INT | —"},{"id":"W29","section":"W","text":"W29 | LIDAR_5V | 22 | red | LOGIC rail | **LiDAR-Lite v3** 5 V, with its **680 µF 10 V electrolytic** right at the sensor's leads (stripe to LIDAR_GND); the red laser's red wire joins its lead there (A37) | 105 mA idle, 170 mA measuring with the red laser on (135 + 35)"},{"id":"W30","section":"W","text":"W30 | LIDAR_GND | 22 | black | STAR | LiDAR GND — **only** the LiDAR (and its capacitor) and the red laser beside it (A38) | 170 mA"},{"id":"W31","section":"W","text":"W31 | T_3V3 | 22 | green | S3 header pin 6 (3V3) | MLX90640 VIN | 25 mA (max; 20 typ)"},{"id":"W32","section":"W","text":"W32 | T_GND | 22 | black | S3 header pin 5 (GND) | MLX90640 GND | 25 mA (max; 20 typ)"},{"id":"W33","section":"W","text":"W33 | T_SDA | 22 | blue | S3 GPIO17 (header pin 9) | MLX90640 SDA | —"},{"id":"W34","section":"W","text":"W34 | T_SCL | 22 | yellow | S3 GPIO18 (header pin 10) | MLX90640 SCL | —"},{"id":"W35","section":"W","text":"W35 | ACCENT | 22 | white | ESP32 4 | three 270 Ω → three red 2 mm accent LEDs, cathodes on the hand ground bus | 14 mA"},{"id":"W36","section":"W","text":"W36 | SRV_A_5V | 22 | red | PCA9685 ch0 header **V+** | hand plate servo A **+** (its red lead, joined in line) | 0.45 A moving, 0.8 A stalled"},{"id":"W37","section":"W","text":"W37 | SRV_A_GND | 22 | black | PCA9685 ch0 header **GND** | hand plate servo A **GND** (its brown lead, joined in line) | 0.8 A"},{"id":"W38","section":"W","text":"W38 | SRV_B_5V | 22 | red | PCA9685 ch1 header **V+** | hand plate servo B **+** (its red lead, joined in line) | 0.45 A moving, 0.8 A stalled"},{"id":"W39","section":"W","text":"W39 | SRV_B_GND | 22 | black | PCA9685 ch1 header **GND** | hand plate servo B **GND** (its brown lead, joined in line) | 0.8 A"},{"id":"W40","section":"W","text":"W40 | RING_5V | 22 | red | PCA9685 ch4 header **V+** | the outer ring's **5 V** (100 µF at the ring) | 0.34 A at the cap"},{"id":"W41","section":"W","text":"W41 | RING_GND | 22 | black | PCA9685 ch4 header **GND** | the outer ring's **GND** — twisted with the ring's data W21 | 0.34 A"},{"id":"A1","section":"A","text":"A1 | hand 3.3 V bus (W23 in) | hand BNO08X **VCC** (no capacitor added: the board carries its own) | 22 | green"},{"id":"A2","section":"A","text":"A2 | hand 3.3 V bus | ADS1115 **VDD** (no capacitor added: the board carries its own) | 22 | green"},{"id":"A3","section":"A","text":"A3 | hand 3.3 V bus | DRV2605L **VIN** (100 µF at it): the motor's current comes from here | 22 | green"},{"id":"A4","section":"A","text":"A4 | hand 3.3 V bus | thumb flex sensor, top | 22 | green"},{"id":"A5","section":"A","text":"A5 | hand 3.3 V bus | index flex sensor, top | 22 | green"},{"id":"A6","section":"A","text":"A6 | hand 3.3 V bus | middle flex sensor, top | 22 | green"},{"id":"A7","section":"A","text":"A7 | hand 3.3 V bus | ring flex sensor, top | 22 | green"},{"id":"A8","section":"A","text":"A8 | hand 3.3 V bus | pinky flex sensor, top | 22 | green"},{"id":"A9","section":"A","text":"A9 | hand ground bus (W24 in) | hand BNO08X **GND** | 22 | black"},{"id":"A10","section":"A","text":"A10 | hand ground bus | ADS1115 **GND** | 22 | black"},{"id":"A11","section":"A","text":"A11 | hand ground bus | DRV2605L **GND** | 22 | black"},{"id":"A12","section":"A","text":"A12 | SDA2 splice (W25 in) | hand BNO08X **SDA** | 22 | blue"},{"id":"A13","section":"A","text":"A13 | SDA2 splice | ADS1115 **SDA** (its board adds 10 kΩ pull-ups) | 22 | blue"},{"id":"A14","section":"A","text":"A14 | SDA2 splice | DRV2605L **SDA** | 22 | blue"},{"id":"A15","section":"A","text":"A15 | SDA2 splice | LiDAR **SDA**, its own cable's blue wire (its 3 kΩ pull-ups set this bus) | the LiDAR's own cable | blue"},{"id":"A16","section":"A","text":"A16 | SCL2 splice (W26 in) | hand BNO08X **SCL** | 22 | yellow"},{"id":"A17","section":"A","text":"A17 | SCL2 splice | ADS1115 **SCL** | 22 | yellow"},{"id":"A18","section":"A","text":"A18 | SCL2 splice | DRV2605L **SCL** | 22 | yellow"},{"id":"A19","section":"A","text":"A19 | SCL2 splice | LiDAR **SCL**, its own cable's green wire | the LiDAR's own cable | green"},{"id":"A20","section":"A","text":"A20 | DRV2605L **OUT+** | #1201 motor **+**, its red lead — no resistor, no diode: the driver does it | the motor's own lead | red"},{"id":"A21","section":"A","text":"A21 | DRV2605L **OUT−** | #1201 motor **−**, its blue lead — an H-bridge: neither wire is a ground | the motor's own lead | blue"},{"id":"A22","section":"A","text":"A22 | index flex sensor, low end | ADS1115 **AIN0**; 47 kΩ + 100 nF from the pin, their ground ends on the hand ground bus | 22 | white"},{"id":"A23","section":"A","text":"A23 | middle flex sensor, low end | ADS1115 **AIN1** (47 kΩ + 100 nF, as A22) | 22 | white"},{"id":"A24","section":"A","text":"A24 | ring flex sensor, low end | ADS1115 **AIN2** (as A22) | 22 | white"},{"id":"A25","section":"A","text":"A25 | pinky flex sensor, low end | ADS1115 **AIN3** (as A22) | 22 | white"},{"id":"A26","section":"A","text":"A26 | outer ring **DOUT** | inner disc **DIN** — the data runs on from the ring's last pixel (11) into the disc (pixels 12–18) | 22 | white"},{"id":"A27","section":"A","text":"A27 | outer ring **5 V** | inner disc **5 V** — a short jump between the two boards' pads, no splice | 22 | red"},{"id":"A28","section":"A","text":"A28 | outer ring **GND** | inner disc **GND** | 22 | black"},{"id":"A29","section":"A","text":"A29 | hand BNO08X **AD0, PS0, PS1** | open — no straps, the board's defaults (Toby, 2026-10-07): I2C at the board's own address (the bench pair answered 0x4B; the firmware probes 0x4A and 0x4B, 00 #27) | — | —"},{"id":"A30","section":"A","text":"A30 | hand BNO08X **CS** and **RST** | open (CS is pulled up on the board) | — | —"},{"id":"A31","section":"A","text":"A31 | ADS1115 **ADDR** | its own GND pin, a short jumper = address 0x48, never floating | — | —"},{"id":"A32","section":"A","text":"A32 | DRV2605L **EN** and **IN/TRIG** | open: the breakout pulls EN up; I2C real-time playback, no trigger wire | — | —"},{"id":"A33","section":"A","text":"A33 | inner disc **DOUT** | nothing — the chain ends at the disc's last pixel (18) | — | —"},{"id":"A34","section":"A","text":"A34 | accent LED 1 **cathode** (short leg, flat side) | the hand ground bus | 22 | black"},{"id":"A35","section":"A","text":"A35 | accent LED 2 **cathode** | the hand ground bus | 22 | black"},{"id":"A36","section":"A","text":"A36 | accent LED 3 **cathode** | the hand ground bus | 22 | black"},{"id":"A37","section":"A","text":"A37 | LiDAR **5 V** — its red lead, where W29 and C16's + leg meet it | the red laser #1056's **red** wire: the laser's 5 V from the LOGIC rail (2026-10-08). A short 22 AWG jump on the back of the hand, joined in line under heat-shrink; 4.8–5.2 V at the laser (05) | 22 | red"},{"id":"A38","section":"A","text":"A38 | LiDAR **GND** — its black lead, where W30 and C16's − leg meet it | the red laser #1056's **black** wire: its return on W30 to the star, never the hand ground | 22 | black"},{"id":"A39","section":"A","text":"A39 | LiDAR **orange** (ENABLE) and **yellow** (MODE) leads | not used: each cut to about 2 cm and insulated **on its own** under heat-shrink — never twisted together or onto another wire (left open, the sensor stays enabled; 05 checks it ranges) | — | —"},{"id":"L1","section":"L","text":"L1 | Green laser (+) | the pod's SERVO 5 V (from the servo rail, 22 AWG red): the Quarton VLM-520-74 is a 3–6 V part, **50 mA measured** (Toby, 2026-10-06) | the + stays on the rail; the − is switched"},{"id":"L2","section":"L","text":"L2 | Green laser (−) | **drain of the RFP30N06LE** (TO-220 in the pod, 22 AWG blue - a switched return, not a ground) | low-side switch; see L8"},{"id":"L3","section":"L","text":"L3 | Laser housing | insulated with heat-shrink; it is at V+ (Quarton). The pod is plastic | —"},{"id":"L4","section":"L","text":"L4 | SSD1306 VCC / GND / SDA / SCL | S3 header pins 6 / 5 / 9 / 10 (3V3 / GND / GPIO17 / GPIO18) | 22 AWG, ≤ 10 cm"},{"id":"L5","section":"L","text":"L5 | Buzzer module | E16 | MusRock passive module, low-level trigger, VCC 3.3 V, PWM tones"},{"id":"L6","section":"L","text":"L6 | Mode switch | E17–E19 | Ruiwaer ON-OFF-ON DPDT slide switch, 6 pins in two rows of three (Toby measured, 2026-10-07): each row is one pole, its middle pin the common; one end joins the common to one outer pin, the middle position joins nothing, the other end joins the other outer pin. **Row 1 used**: one outer pin → GPIO 36 (E17), the middle pin → the ESP32 ground bus (E19), the other outer pin → GPIO 39 (E18); **row 2 empty**. The pull-ups R12 / R13 (10 kΩ to 3.3 V) and the 100 nF C5 / C6 sit at the ESP32 (§13): 36 and 39 have no internal pull-ups. **Positions (Toby, 2026-10-08, reordered): the middle = SAFE** (both pins high), **the GPIO 36 end = SHOW** (36 low), **the GPIO 39 end = FULL** (39 low); both low reads SAFE. So a broken wire to either end, a lost common or a bad contact reads both high = SAFE, never a live mode; SHOW ↔ FULL passes the middle = SAFE while the lever is there; power-up stays SAFE until the middle has been seen once. The rules are 07's table. **It sits in a printed cover / recess** (Toby's CAD) so a sleeve or a hand cannot slide it by accident"},{"id":"L7","section":"L","text":"L7 | Master switch | P6–P7 | Ruiwaer slide switch, 3 pins in a row (Toby measured, 2026-10-07): the middle pin is the common and joins one outer pin or the other. Middle → the star (P7), one outer pin → the IRF4905 gate (P6), the other outer pin empty; microamps"},{"id":"L8","section":"L","text":"L8 | RFP30N06LE (pod) | G ← S11 through **1 kΩ**, **100 kΩ G–S pull-down**, D → laser (−) (L2), **S → star ground** (the servo ground, 22 AWG black); tab = drain = the laser's − node - keep it off the laser housing (V+) | logic-level N-FET (Vgs(th) 1–2 V, ~50 mΩ at 3.3 V): 5 mV at 50 mA, no heatsink. One of the arm's five MOSFETs"},{"id":"R1","section":"K","text":"R1 | IRF4905 gate pull-up | 100 kΩ | elbow, across the IRF4905's legs | the gate leg (1) | the source leg (3) | F | pull-up | so the FET stays off, and the arm dark, until the on/off switch pulls its gate down"},{"id":"R2","section":"K","text":"R2 | battery divider, top | 100 kΩ | elbow, in line with R3 under one heat-shrink sleeve | the yellow 22 AWG wire from the battery + bus (P16) | the divider node splice | F | divider | so GPIO 35 reads the pack at 22 / 122 of its voltage (8.7 V full → 1.57 V)"},{"id":"R3","section":"K","text":"R3 | battery divider, bottom | 22 kΩ | elbow, in line with R2 (22 k as Toby built it, 2026-10-13 - 33 k was drawn) | the divider node splice | the black 22 AWG wire to the star (P16) | F | divider | so GPIO 35 reads the pack at 22 / 122 of its voltage (8.7 V full → 1.57 V)"},{"id":"R4","section":"K","text":"R4 | bus 1 SDA pull-up | 2.2 kΩ | beside the ESP32 | the ESP32's GPIO 21 pin | the 3.3 V bus | F | pull-up | so bus 1 idles high with sharp edges for the PCA9685, the forearm IMU and the INA219"},{"id":"R5","section":"K","text":"R5 | bus 1 SCL pull-up | 2.2 kΩ | beside the ESP32 | the ESP32's GPIO 22 pin | the 3.3 V bus | F | pull-up | so bus 1 idles high with sharp edges for the PCA9685, the forearm IMU and the INA219"},{"id":"R6","section":"K","text":"R6 | PCA9685 OE pull-up | 1 kΩ | at the PCA9685, on its logic header | the OE pin | the VCC pin (3.3 V) | F | pull-up | so every PCA9685 output stays off from power-on until the firmware drives OE low"},{"id":"R7","section":"K","text":"R7 | arm strip data resistor | 330 Ω | at the ESP32's GPIO 13 pin, in line, under heat-shrink | the ESP32's GPIO 13 pin | the white wire to the strip's DIN (E10) | F | data resistor | so the data edge into the first pixel stays clean, and a fault on the strip's wire pushes only a few mA into the pin - it lowers the risk, it does not make the pin 5 V tolerant"},{"id":"R8","section":"K","text":"R8 | palm data resistor | 330 Ω | at the ESP32's GPIO 27 pin, in line, under heat-shrink (moved from the ring end 2026-10-07, like R7) | the ESP32's GPIO 27 pin | W21 RING_DATA to the outer ring's DIN | F | data resistor | so the data edge into the first pixel stays clean on the 30 cm wire; if W21 ever touches a 5 V wire it limits the current into GPIO 27 to about 4 mA - the pin is still not 5 V tolerant, so W21 stays twisted with its ground W41, away from the 5 V wires"},{"id":"R9","section":"K","text":"R9 | accent LED 1 resistor | 270 Ω | palm, in line in accent LED 1's anode leg, under heat-shrink | the accent splice | accent LED 1's anode (long leg) | P | LED resistor | so each accent LED takes about 5 mA from GPIO 4"},{"id":"R10","section":"K","text":"R10 | accent LED 2 resistor | 270 Ω | palm, in line in accent LED 2's anode leg | the accent splice | accent LED 2's anode | P | LED resistor | so each accent LED takes about 5 mA from GPIO 4"},{"id":"R11","section":"K","text":"R11 | accent LED 3 resistor | 270 Ω | palm, in line in accent LED 3's anode leg | the accent splice | accent LED 3's anode | P | LED resistor | so each accent LED takes about 5 mA from GPIO 4"},{"id":"R12","section":"K","text":"R12 | mode switch pole A pull-up | 10 kΩ | beside the ESP32 | the ESP32's GPIO 36 pin | the 3.3 V bus | F | pull-up | so the pin reads high while its pole is open (GPIO 36 and 39 have no pull-up of their own)"},{"id":"R13","section":"K","text":"R13 | mode switch pole B pull-up | 10 kΩ | beside the ESP32 | the ESP32's GPIO 39 pin | the 3.3 V bus | F | pull-up | so the pin reads high while its pole is open (GPIO 36 and 39 have no pull-up of their own)"},{"id":"R14","section":"K","text":"R14 | thumb flex divider | 47 kΩ | at the ESP32's GPIO 34 pin | the ESP32's GPIO 34 pin | the ESP32 ground bus | F | divider | so the thumb's bend reads as a voltage on GPIO 34"},{"id":"R15","section":"K","text":"R15 | index flex divider | 47 kΩ | palm, at the ADS1115's AIN0 pin | the AIN0 pin | the hand ground bus | P | divider | so each finger's bend reads as a voltage on the ADS1115"},{"id":"R16","section":"K","text":"R16 | middle flex divider | 47 kΩ | palm, at the ADS1115's AIN1 pin | the AIN1 pin | the hand ground bus | P | divider | so each finger's bend reads as a voltage on the ADS1115"},{"id":"R17","section":"K","text":"R17 | ring flex divider | 47 kΩ | palm, at the ADS1115's AIN2 pin | the AIN2 pin | the hand ground bus | P | divider | so each finger's bend reads as a voltage on the ADS1115"},{"id":"R18","section":"K","text":"R18 | pinky flex divider | 47 kΩ | palm, at the ADS1115's AIN3 pin | the AIN3 pin | the hand ground bus | P | divider | so each finger's bend reads as a voltage on the ADS1115"},{"id":"R19","section":"K","text":"R19 | green laser FET gate resistor | 1 kΩ | in the pod, at the RFP30N06LE's gate leg | the white wire from PCA ch 7 (S11) | the gate leg (1) | F | gate resistor | so the PCA9685's channel charges the FET's gate without a current spike"},{"id":"R20","section":"K","text":"R20 | green laser FET gate pull-down | 100 kΩ | in the pod, across the RFP30N06LE's legs | the gate leg (1) | the source leg (3) | F | pull-down | so the green laser stays off whenever ch 7 is not driving the gate"},{"id":"R21","section":"K","text":"R21 | show bus SDA pull-up | 4.7 kΩ | at the S3 end of the show bus | the wire on S3 header pin 9 (GPIO17) | the wire on S3 header pin 6 (3V3) | F | pull-up | so the show bus works over the long wrist wire to the thermal camera"},{"id":"R22","section":"K","text":"R22 | show bus SCL pull-up | 4.7 kΩ | at the S3 end of the show bus | the wire on S3 header pin 10 (GPIO18) | the wire on S3 header pin 6 (3V3) | F | pull-up | so the show bus works over the long wrist wire to the thermal camera"},{"id":"R23","section":"K","text":"R23 | round screen UART TX resistor | 1 kΩ | at the ESP32's GPIO 18 pin, in line, under heat-shrink (2026-10-08) | the ESP32's GPIO 18 pin | the white wire E14 to the round screen's header pin 8 (GPIO16, its RX) | F | data resistor | so neither board can drive the other's pin hard while one of them is unpowered (one flashed on USB, the puck unplugged): about 3 mA at most, and 115200 baud does not notice it"},{"id":"R24","section":"K","text":"R24 | round screen UART RX resistor | 1 kΩ | at the ESP32's GPIO 19 pin, in line, under heat-shrink (2026-10-08) | the white wire E15 from the round screen's header pin 7 (GPIO15, its TX) | the ESP32's GPIO 19 pin | F | data resistor | so neither board can drive the other's pin hard while one of them is unpowered (one flashed on USB, the puck unplugged): about 3 mA at most, and 115200 baud does not notice it"},{"id":"C1","section":"K","text":"C1 | servo regulator output | 1000 µF 16 V | elbow, across the D24V50F5's own pins | + on VOUT | − (stripe) on GND | F | supply capacitor | so the servos' current kicks come from it, not from the regulator"},{"id" eady"},{"id":"J7","section":"K","text":"J7 | ADS1115 address strap | short 22 AWG black jumper | on the ADS1115 | its ADDR pin | its own GND pin (= 0x48) | P | address strap | KEPT unless a meter shows the board already pulls ADDR down (05 step 8: ADDR to GND, unpowered, about 10 kΩ = it does; no HiLetgo schematic says either way) - so it answers at 0x48 and the address never floats"},{"id":"J8","section":"K","text":"J8 | INA219 address bridge | a blob of solder | on the HiLetgo INA219, the pad marked A0 under \"I2C Address\" | one half of the A0 pad | the other half (bridged = 0x41) | F | address bridge | so it answers at 0x41, not at the PCA9685's 0x40"}],"runs":[{"id":"L1","run":"Battery XT30 → the power parts (fuse holder + switch)","why":"the 9 A peak flows here; sets the only drop that is in series with everything","cm":20},{"id":"L2","run":"Power parts → PCA9685 V+ block (servo rail, through the INA219)","why":"the forearm servos' current","cm":20},{"id":"L3","run":"Power parts → arm strip, elbow end","why":"1 A strip feed","cm":20},{"id":"L4","run":"Power parts → arm strip, wrist end","why":"not wired: the strip has one feed, at its start (Toby, 2026-10-07)","cm":20},{"id":"L5","run":"Power parts → ESP32 (logic rail)","why":"","cm":20},{"id":"L6","run":"Power parts → round display USB-C power plug (P21 / P22)","why":"","cm":20},{"id":"L7","run":"Power parts → the three D4184 modules (RAW, one pair per group)","why":"4.8 A with all seven LED drivers on, 2.05 A at most in one pair","cm":20},{"id":"L8","run":"Power parts → ELRS module","why":"","cm":20},{"id":"L9","run":"ESP32 → wrist","why":"bus 2, thumb, 3V3 to the palm","cm":20},{"id":"L10","run":"Power parts → wrist (elbow to wrist)","why":"servo 5 V to the palm, LED driver pairs","cm":20},{"id":"L10 + L11","run":"Power parts → palm centre","why":"the LED, power and sense looms","cm":30},{"id":"L10 + L12","run":"Power parts → fingertip LED (the longer finger)","why":"the LED loom, the flex sensors","cm":38}     else if (gm && i.k === 'pin' && lab === 'esp32 · gpio' + gm[1]) score = 100;
    else if (cm && i.k === 'pin' && lab === 'pca9685 · ch' + cm[1]) score = 100;
    else if (toks.every(t => all.includes(t))) score = (toks.every(t => lab.includes(t)) ? 50 : 20) + (i.k === 'part' ? 15 : i.k === 'wire' ? 5 : 0) - lab.length / 40;
